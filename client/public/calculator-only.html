<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢能力值計算器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .calculator-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #3498db;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 100px 1fr 1fr 120px 120px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .stat-label {
      font-weight: 600;
      color: #2c3e50;
    }

    .stat-value {
      text-align: center;
      padding: 8px;
      background: white;
      border-radius: 6px;
      font-weight: 500;
    }

    .result-box {
      background: #e3f2fd;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .result-label {
      font-weight: 600;
      color: #1976d2;
    }

    .result-value {
      font-weight: 700;
      color: #0d47a1;
    }

    .button {
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .button:hover {
      background: #2980b9;
    }

    .button-secondary {
      background: #95a5a6;
    }

    .button-secondary:hover {
      background: #7f8c8d;
    }

    .total-ev {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .warning {
      color: #e74c3c;
    }

    @media (max-width: 768px) {
      .stat-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      
      .stat-label {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="calculator-container">
    <div class="section">
      <h2 class="section-title">性格選擇</h2>
      <div class="input-group">
        <label for="nature">選擇性格</label>
        <select id="nature">
          <option value="hardy">勤奮（無加成）</option>
          <option value="lonely">怕寂寞（攻擊↑ 防禦↓）</option>
          <option value="brave">勇敢（攻擊↑ 速度↓）</option>
          <option value="adamant">固執（攻擊↑ 特攻↓）</option>
          <option value="naughty">頑皮（攻擊↑ 特防↓）</option>
          <option value="bold">大膽（防禦↑ 攻擊↓）</option>
          <option value="docile">坦率（無加成）</option>
          <option value="relaxed">悠閒（防禦↑ 速度↓）</option>
          <option value="impish">淘氣（防禦↑ 特攻↓）</option>
          <option value="lax">樂天（防禦↑ 特防↓）</option>
          <option value="timid">膽小（速度↑ 攻擊↓）</option>
          <option value="hasty">急躁（速度↑ 防禦↓）</option>
          <option value="serious">認真（無加成）</option>
          <option value="jolly">爽朗（速度↑ 特攻↓）</option>
          <option value="naive">天真（速度↑ 特防↓）</option>
          <option value="modest">內斂（特攻↑ 攻擊↓）</option>
          <option value="mild">慎重（特攻↑ 防禦↓）</option>
          <option value="quiet">冷靜（特攻↑ 速度↓）</option>
          <option value="bashful">害羞（無加成）</option>
          <option value="rash">馬虎（特攻↑ 特防↓）</option>
          <option value="calm">溫和（特防↑ 攻擊↓）</option>
          <option value="gentle">溫順（特防↑ 防禦↓）</option>
          <option value="sassy">自大（特防↑ 速度↓）</option>
          <option value="careful">慎重（特防↑ 特攻↓）</option>
          <option value="quirky">浮躁（無加成）</option>
        </select>
      </div>
    </div>

    <div class="total-ev">
      總努力值：<span id="totalEV">0</span> / 510
    </div>

    <div class="section">
      <h2 class="section-title">能力值設定</h2>
      
      <div class="stat-row">
        <div class="stat-label">HP</div>
        <div>
          <label style="font-size: 0.9rem; margin-bottom: 4px;">IV (0-31)</label>
          <input type="number" id="hp-iv" min="0" max="31" value="31">
        </div>
        <div>
          <label style="font-size: 0.9rem; margin-bottom: 4px;">EV (0-252)</label>
          <input type="number" id="hp-ev" min="0" max="252" step="4" value="0">
        </div>
        <div>
          <label style="font-size: 0.9rem; margin-bottom: 4px;">Lv.50</label>
          <div class="stat-value" id="hp-lv50">-</div>
        </div>
        <div>
          <label style="font-size: 0.9rem; margin-bottom: 4px;">Lv.100</label>
          <div class="stat-value" id="hp-lv100">-</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-label">攻擊</div>
        <div>
          <input type="number" id="attack-iv" min="0" max="31" value="31">
        </div>
        <div>
          <input type="number" id="attack-ev" min="0" max="252" step="4" value="0">
        </div>
        <div class="stat-value" id="attack-lv50">-</div>
        <div class="stat-value" id="attack-lv100">-</div>
      </div>

      <div class="stat-row">
        <div class="stat-label">防禦</div>
        <div>
          <input type="number" id="defense-iv" min="0" max="31" value="31">
        </div>
        <div>
          <input type="number" id="defense-ev" min="0" max="252" step="4" value="0">
        </div>
        <div class="stat-value" id="defense-lv50">-</div>
        <div class="stat-value" id="defense-lv100">-</div>
      </div>

      <div class="stat-row">
        <div class="stat-label">特攻</div>
        <div>
          <input type="number" id="special-attack-iv" min="0" max="31" value="31">
        </div>
        <div>
          <input type="number" id="special-attack-ev" min="0" max="252" step="4" value="0">
        </div>
        <div class="stat-value" id="special-attack-lv50">-</div>
        <div class="stat-value" id="special-attack-lv100">-</div>
      </div>

      <div class="stat-row">
        <div class="stat-label">特防</div>
        <div>
          <input type="number" id="special-defense-iv" min="0" max="31" value="31">
        </div>
        <div>
          <input type="number" id="special-defense-ev" min="0" max="252" step="4" value="0">
        </div>
        <div class="stat-value" id="special-defense-lv50">-</div>
        <div class="stat-value" id="special-defense-lv100">-</div>
      </div>

      <div class="stat-row">
        <div class="stat-label">速度</div>
        <div>
          <input type="number" id="speed-iv" min="0" max="31" value="31">
        </div>
        <div>
          <input type="number" id="speed-ev" min="0" max="252" step="4" value="0">
        </div>
        <div class="stat-value" id="speed-lv50">-</div>
        <div class="stat-value" id="speed-lv100">-</div>
      </div>
    </div>

    <div style="display: flex; gap: 12px; justify-content: center;">
      <button class="button" onclick="setMaxIV()">設為最大 IV</button>
      <button class="button button-secondary" onclick="resetAll()">重置所有</button>
    </div>
  </div>

  <script>
    // 性格數據
    const natures = {
      hardy: { increase: null, decrease: null },
      lonely: { increase: 'attack', decrease: 'defense' },
      brave: { increase: 'attack', decrease: 'speed' },
      adamant: { increase: 'attack', decrease: 'special-attack' },
      naughty: { increase: 'attack', decrease: 'special-defense' },
      bold: { increase: 'defense', decrease: 'attack' },
      docile: { increase: null, decrease: null },
      relaxed: { increase: 'defense', decrease: 'speed' },
      impish: { increase: 'defense', decrease: 'special-attack' },
      lax: { increase: 'defense', decrease: 'special-defense' },
      timid: { increase: 'speed', decrease: 'attack' },
      hasty: { increase: 'speed', decrease: 'defense' },
      serious: { increase: null, decrease: null },
      jolly: { increase: 'speed', decrease: 'special-attack' },
      naive: { increase: 'speed', decrease: 'special-defense' },
      modest: { increase: 'special-attack', decrease: 'attack' },
      mild: { increase: 'special-attack', decrease: 'defense' },
      quiet: { increase: 'special-attack', decrease: 'speed' },
      bashful: { increase: null, decrease: null },
      rash: { increase: 'special-attack', decrease: 'special-defense' },
      calm: { increase: 'special-defense', decrease: 'attack' },
      gentle: { increase: 'special-defense', decrease: 'defense' },
      sassy: { increase: 'special-defense', decrease: 'speed' },
      careful: { increase: 'special-defense', decrease: 'special-attack' },
      quirky: { increase: null, decrease: null }
    };

    // 預設種族值（皮卡丘）
    const baseStats = {
      hp: 35,
      attack: 55,
      defense: 40,
      'special-attack': 50,
      'special-defense': 50,
      speed: 90
    };

    // 計算 HP
    function calculateHP(base, iv, ev, level) {
      return Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + level + 10;
    }

    // 計算其他能力值
    function calculateStat(base, iv, ev, level, nature, statName) {
      let stat = Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + 5;
      
      if (nature.increase === statName) {
        stat = Math.floor(stat * 1.1);
      } else if (nature.decrease === statName) {
        stat = Math.floor(stat * 0.9);
      }
      
      return stat;
    }

    // 更新計算
    function updateCalculation() {
      const nature = natures[document.getElementById('nature').value];
      const stats = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
      
      let totalEV = 0;
      
      stats.forEach(stat => {
        const iv = parseInt(document.getElementById(`${stat}-iv`).value) || 0;
        const ev = parseInt(document.getElementById(`${stat}-ev`).value) || 0;
        totalEV += ev;
        
        let lv50, lv100;
        
        if (stat === 'hp') {
          lv50 = calculateHP(baseStats[stat], iv, ev, 50);
          lv100 = calculateHP(baseStats[stat], iv, ev, 100);
        } else {
          lv50 = calculateStat(baseStats[stat], iv, ev, 50, nature, stat);
          lv100 = calculateStat(baseStats[stat], iv, ev, 100, nature, stat);
        }
        
        document.getElementById(`${stat}-lv50`).textContent = lv50;
        document.getElementById(`${stat}-lv100`).textContent = lv100;
      });
      
      const totalEVEl = document.getElementById('totalEV');
      totalEVEl.textContent = totalEV;
      totalEVEl.className = totalEV > 510 ? 'warning' : '';
    }

    // 設為最大 IV
    function setMaxIV() {
      const stats = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
      stats.forEach(stat => {
        document.getElementById(`${stat}-iv`).value = 31;
      });
      updateCalculation();
    }

    // 重置所有
    function resetAll() {
      const stats = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
      stats.forEach(stat => {
        document.getElementById(`${stat}-iv`).value = 31;
        document.getElementById(`${stat}-ev`).value = 0;
      });
      document.getElementById('nature').value = 'hardy';
      updateCalculation();
    }

    // 監聽所有輸入變化
    document.addEventListener('DOMContentLoaded', () => {
      const stats = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
      stats.forEach(stat => {
        document.getElementById(`${stat}-iv`).addEventListener('input', updateCalculation);
        document.getElementById(`${stat}-ev`).addEventListener('input', updateCalculation);
      });
      document.getElementById('nature').addEventListener('change', updateCalculation);
      
      // 初始計算
      updateCalculation();
    });
  </script>
</body>
</html>
